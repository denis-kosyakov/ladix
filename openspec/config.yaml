schema: spec-driven

# Контекст проекта — показывается ИИ при создании артефактов.
context: |
  ## Проект
  Ladix — декларативно-императивный DSL (кириллические ключевые слова) для системы управления
  бизнесом «Уклад»: метрики/KPI, бизнес-процессы с человеком-в-цикле и триггеры, их связывающие.
  Не язык общего назначения. v2 финализирована (M1 аналитика, M-DX диагностика, M2 автоматизация,
  M3 надёжность); дальнейшее развитие — АДДИТИВНО, синтаксис пользователя не ломать.
  Onboarding: AGENTS.md. Концепция + контракт CLI: README.md. Язык: SPEC.md. Модули: ARCHITECTURE.md.

  ## Стек и раскладка
  - Go 1.25 (минимум 1.22), модуль github.com/denis-kosyakov/ladix В КОРНЕ репо; все команды из корня.
  - CGO ЗАПРЕЩЁН; единственная внешняя зависимость — modernc.org/sqlite. Новые зависимости — только
    по явному зафиксированному решению.
  - cmd/ladix/ — CLI (run, metric, start, complete, tasks, serve, emit, inspect).
  - internal/{lexer,parser,ast,value,errors,eval,engine,store,daemon,jsonval} — внутренние пакеты.
  - Публичная поверхность — РОВНО два пакета: корневой ladix (фасад Compile/CompileFile) и ir
    (контракт IR со schema_version). Им ЗАПРЕЩЕНО зависеть от internal/{store,engine,daemon} и
    sqlite (страж границы boundary_test.go). Листовые пакеты: value, errors, ast, ir; граф без циклов.
  - Сборка/проверка: go build -o ladix ./cmd/ladix; go test ./...; go vet ./... (без замечаний); gofmt.

  ## Конституция (.specify/memory/constitution.md — 9 принципов, обязательны для каждого change)
  I   Go идиоматичный, gofmt, vet чист, без CGO, один статический бинарник.
  II  Лексер/парсер — ручной recursive descent; генераторы парсеров и regex-токенизация ЗАПРЕЩЕНЫ.
  III Ошибки — явные типы в internal/errors с Position; errors.Is/As; паника только как инвариант
      «не должно случиться»; на границе каждой CLI-подкоманды recover-барьер без Go stack trace.
  IV  Position{Line,Col} с 1 на каждом токене и узле AST, сквозь рантайм; колонки в РУНАХ;
      каждая пользовательская ошибка печатает строку И колонку.
  V   Без изменяемого состояния уровня пакета; зависимости инжектируются (Store — интерфейс, Clock).
  VI  Tests-first для лексера/парсера; табличные тесты + негативные кейсы; тесты — часть каждой задачи.
  VII Раскладка как выше; расширение публичной поверхности только аддитивно.
  VIII ВСЕ пользовательские сообщения на русском, дословно по канону SPEC §13 (двухстрочный формат
      «Ошибка в строке N, колонка M:»); переформулировать тексты диагностик ЗАПРЕЩЕНО.
  IX  Спека — источник истины (SPEC.md, docs/*-model.md, grammar.md, stdlib.md, ARCHITECTURE.md,
      README.md). Пробел или противоречие — остановиться и спросить, не додумывать.

  ## Документация (русская)
  - docs/*-model.md — канонические модели (eval, engine, execution, process, trigger, source-metric,
    source-connectors, metric-windows, automation, reliability, inbound-events, diagnostics,
    datetime-builtins, module-contract). Любое изменение поведения синхронизируется с ними (doc-sync).
  - examples/*.ladix + examples/MANIFEST.md — исполняемые витрины; golden-тесты на их вывод.
  - specs/001–029 — архив SpecKit-артефактов предыдущих фич (история; новые фичи ведутся в openspec/).
  - Язык документации и спек — русский; английский только в Go-коде и комментариях.

  ## Практики, выработанные за 29 фич
  - Каждая фича объявляет ГРАНИЦЫ диффа (какие пакеты трогаются, какие остаются с ПУСТЫМ диффом).
  - Замки-тесты: каждый новый инвариант закрывается тестом, который краснеет при удалении гарда
    (мутационная проверка); compile-замки на число методов интерфейса Store.
  - Детерминизм: время только через инжектируемые часы (engine.Clock / FixedClock), никакого time.Now в тестах.
  - Коммиты и PR — на русском, conventional-prefix (feat/test/docs/chore/merge).
  - Контекст основного потока агента ≤20%: тяжёлые чтение/поиск делегировать субагентам.

rules:
  proposal:
    - Писать на русском.
    - Обязательные разделы: «Не-цели» и «Границы диффа» (пакеты с изменениями / пакеты с пустым диффом).
    - Явно перечислить новые ключевые слова, builtins, коды ошибок, зависимости — по умолчанию их 0.
  specs:
    - Тексты пользовательских сообщений приводить дословно (Принцип VIII); формат WHEN/THEN на русском.
  design:
    - Пройти чек-лист Конституции I–IX и зафиксировать результат (PASS / отклонение с обоснованием).
    - Указать, какие docs/*-model.md требуют doc-sync.
  tasks:
    - Тесты-замки и мутационная проверка — отдельные задачи, не «потом».
    - Последняя задача — go build / go vet / go test ./... зелёные + doc-sync.

operations:
  apply:
    guidance:
      - Перед правкой кода прочитать соответствующий docs/*-model.md; при противоречии — остановиться и спросить.
      - Не расширять границы диффа, объявленные в proposal.
  archive:
    guidance:
      - Убедиться, что дельты спек влиты в openspec/specs и docs/*-model.md синхронизированы.
